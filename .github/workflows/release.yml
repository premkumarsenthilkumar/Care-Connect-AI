name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

      - name: Package web distribution
        run: |
          cd dist && zip -r ../CareConnect-AI-${{ github.ref_name }}-web.zip . && cd ..
          sha256sum CareConnect-AI-${{ github.ref_name }}-web.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CareConnect-AI-${{ github.ref_name }}-web.zip
            checksums.txt
